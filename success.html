<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الإرسال بنجاح — Oimaroc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 60%, #f3e5f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 48px rgba(233,30,140,.18);
    }
    .icon { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 900; color: #880e4f; margin-bottom: 12px; }
    p  { font-size: 1rem; color: #7c3a5a; line-height: 1.7; margin-bottom: 28px; }
    a  {
      display: inline-block;
      background: linear-gradient(135deg, #e91e8c 0%, #880e4f 100%);
      color: white;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-weight: 700;
      font-size: .95rem;
      transition: opacity .2s;
    }
    a:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>تم إرسال طلبك بنجاح!</h1>
    <p>شكراً لاهتمامك. سيتواصل معك فريقنا قريباً عبر WhatsApp للإجابة على استفساراتك وتأكيد طلبك.</p>
    <a href="/najara.html">← العودة للصفحة الرئيسية</a>
  </div>
  <script>
    // confetti
    const colors = ['#e91e8c','#880e4f','#c2185b','#f48fb1','#c9922b'];
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;width:8px;height:8px;border-radius:2px;
        background:${colors[i%colors.length]};top:-10px;
        left:${Math.random()*100}vw;opacity:${.6+Math.random()*.4};
        animation:fall ${1.5+Math.random()*2}s ease-in ${Math.random()*1.5}s forwards`;
      document.body.appendChild(el);
    }
    const s = document.createElement('style');
    s.textContent = '@keyframes fall{to{top:110vh;transform:rotate(720deg)}}';
    document.head.appendChild(s);
  </script>
</body>
</html>
